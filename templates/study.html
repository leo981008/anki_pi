{% extends "base.html" %}

{% block title %}學習模式 - {{ title }}{% endblock %}

{% block content %}
<div class="study-wrapper">
    <!-- Header -->
    <div class="study-header">
        <div class="study-header-left">
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left"></i> 結束學習</a>
            <h2>正在學習：<span class="study-title">{{ title }}</span></h2>
        </div>
        <div class="study-progress-wrapper">
            <span class="progress-label">待複習: <strong id="due-count">0</strong></span>
            <span class="progress-label">新卡片: <strong id="new-count">0</strong></span>
        </div>
    </div>

    <!-- Main Study Card Area -->
    <div class="study-card-container">
        <!-- The Flip Card -->
        <div class="flip-card" id="flip-card">
            <div class="flip-card-inner">
                <!-- Front Side -->
                <div class="flip-card-front" id="card-front-side">
                    <div class="card-badges">
                        <span class="badge" id="front-type-badge">類型</span>
                    </div>
                    <div class="card-main-content">
                        <h1 class="card-word font-outfit" id="front-text">載入中...</h1>
                    </div>
                    <div class="card-actions-row">
                        <button class="btn-dict" id="dict-btn" title="Cambridge 字典"><i class="fa-solid fa-book"></i></button>
                    </div>
                </div>

                <!-- Back Side -->
                <div class="flip-card-back" id="card-back-side">
                    <div class="card-badges">
                        <span class="badge" id="back-type-badge">類型</span>
                    </div>
                    <div class="card-main-content">
                        <div class="back-text-container" id="back-text">
                            釋義載入中...
                        </div>
                    </div>
                    <div class="card-actions-row" id="back-actions-row">
                        <!-- Dict will also be visible here for reference -->
                        <button class="btn-dict" id="dict-btn-back" title="Cambridge 字典"><i class="fa-solid fa-book"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Interaction Panel -->
    <div class="study-interaction-panel">

        <!-- 1. Spell Mode Text Input Panel -->
        <div class="spell-input-panel hidden" id="spell-panel">
            <p class="spell-prompt"><i class="fa-solid fa-pen-clip"></i> 請輸入英文拼寫：</p>
            <div class="spell-input-group">
                <input type="text" id="spell-input" class="form-control spell-text-field" placeholder="在這裡拼寫單字..." autocomplete="off" autofocus>
                <button class="btn btn-primary" id="spell-submit-btn">送出答案</button>
            </div>
            <div class="spell-result-alert hidden" id="spell-result">
                <!-- Will be populated dynamically -->
            </div>
        </div>

        <!-- 2. "Show Answer" Panel -->
        <div class="show-answer-panel" id="show-answer-panel">
            <button class="btn btn-primary btn-lg btn-block" id="btn-show-answer">
                <i class="fa-solid fa-eye"></i> 顯示答案 (Space)
            </button>
        </div>

        <!-- 3. FSRS Rating Buttons Panel -->
        <div class="rating-panel hidden" id="rating-panel">
            <button class="btn-rating btn-again" data-rating="1">
                <span class="rating-num">1</span>
                <span class="rating-text">忘記 (Again)</span>
            </button>
            <button class="btn-rating btn-hard" data-rating="2">
                <span class="rating-num">2</span>
                <span class="rating-text">困難 (Hard)</span>
            </button>
            <button class="btn-rating btn-good" data-rating="3">
                <span class="rating-num">3</span>
                <span class="rating-text">普通 (Good)</span>
            </button>
            <button class="btn-rating btn-easy" data-rating="4">
                <span class="rating-num">4</span>
                <span class="rating-text">簡單 (Easy)</span>
            </button>
        </div>
    </div>

    <!-- Complete/Empty State Screen -->
    <div class="study-complete-screen hidden" id="complete-screen">
        <div class="complete-content">
            <i class="fa-solid fa-circle-check complete-icon"></i>
            <h2>太棒了！</h2>
            <p>今天的所有記憶卡已經全部複習完畢！🎉</p>
            <div class="complete-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="fa-solid fa-home"></i> 返回儀表板</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const modeType = "{{ mode_type }}";
    const modeId = parseInt("{{ mode_id }}");


    let dueQueue = [];
    let newQueue = [];
    let activeQueue = []; // Current active session cards
    let currentCard = null;
    let spellShownSide = 'front'; // In spell mode, is front or back shown initially
    let reviewSubmitting = false;

    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    // DOM Elements
    const flipCard = document.getElementById('flip-card');
    const dueCountEl = document.getElementById('due-count');
    const newCountEl = document.getElementById('new-count');
    const frontText = document.getElementById('front-text');
    const backText = document.getElementById('back-text');
    const frontTypeBadge = document.getElementById('front-type-badge');
    const backTypeBadge = document.getElementById('back-type-badge');
    const dictBtn = document.getElementById('dict-btn');
    const dictBtnBack = document.getElementById('dict-btn-back');

    const showAnswerPanel = document.getElementById('show-answer-panel');
    const btnShowAnswer = document.getElementById('btn-show-answer');
    const ratingPanel = document.getElementById('rating-panel');

    const spellPanel = document.getElementById('spell-panel');
    const spellInput = document.getElementById('spell-input');
    const spellSubmitBtn = document.getElementById('spell-submit-btn');
    const spellResultAlert = document.getElementById('spell-result');
    const completeScreen = document.getElementById('complete-screen');
    const studyWrapper = document.querySelector('.study-wrapper');

    // XSS 防護：HTML 轉義函數
    function escapeHtml(unsafe) {
        if (unsafe == null) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Load cards on page load
    window.addEventListener('DOMContentLoaded', () => {
        fetchCards();
        setupEventListeners();
    });

    function fetchCards() {
        fetch(`/study/api/cards?type=${modeType}&id=${modeId}`)
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    alert('載入記憶卡失敗！');
                    return;
                }
                dueQueue = data.due_cards || [];
                newQueue = data.new_cards || [];

                // Shuffle both queues
                shuffleArray(dueQueue);
                shuffleArray(newQueue);

                // Protect the review backlog: scheduled cards come before new material.
                activeQueue = [...dueQueue, ...newQueue];

                updateProgressUI();
                showNextCard();
            })
            .catch(err => {
                console.error(err);
                alert('伺服器連線錯誤！');
            });
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function updateProgressUI() {
        // Calculate remaining in active queue
        let dueRemaining = activeQueue.filter(c => c.reps > 0).length;
        let newRemaining = activeQueue.filter(c => c.reps === 0).length;
        dueCountEl.textContent = dueRemaining;
        newCountEl.textContent = newRemaining;
    }

    function showNextCard() {
        // Reset card flip and state
        flipCard.classList.remove('flipped');
        spellResultAlert.classList.add('hidden');
        spellResultAlert.className = "spell-result-alert hidden";
        spellInput.value = "";
        reviewSubmitting = false;
        document.querySelectorAll('.btn-rating').forEach(btn => btn.disabled = false);

        if (activeQueue.length === 0) {
            // Study Complete
            document.querySelector('.study-card-container').classList.add('hidden');
            document.querySelector('.study-interaction-panel').classList.add('hidden');
            completeScreen.classList.remove('hidden');
            return;
        }

        currentCard = activeQueue[0];

        // Populate Front / Back text (使用 textContent 防止 XSS)
        frontText.textContent = currentCard.front;
        // Format back text (newlines to br) - 先轉義再替換換行
        backText.innerHTML = escapeHtml(currentCard.back).replace(/\n/g, '<br>');

        // Set type badges
        const typeText = currentCard.card_type === 'spell' ? '拼寫卡 (spell)' : '認得卡 (recognize)';
        const badgeClass = currentCard.card_type === 'spell' ? 'badge-spell-type' : 'badge-recognize-type';

        frontTypeBadge.textContent = typeText;
        frontTypeBadge.className = `badge ${badgeClass}`;
        backTypeBadge.textContent = typeText;
        backTypeBadge.className = `badge ${badgeClass}`;

        // Reset display panel states
        spellPanel.classList.add('hidden');
        ratingPanel.classList.add('hidden');
        showAnswerPanel.classList.add('hidden');

        // Check Mode
        if (currentCard.card_type === 'spell') {
            // In spell mode, 50% chance to show front first (recognize), 50% chance to show back first (spell)
            // But if it shows back first, we need to ask user to spell the front!
            spellShownSide = Math.random() < 0.5 ? 'front' : 'back';

            if (spellShownSide === 'back') {
                // Show back initially (flip it!)
                flipCard.classList.add('flipped');
                spellPanel.classList.remove('hidden');
                showAnswerPanel.classList.add('hidden');
                requestAnimationFrame(() => spellInput.focus());
            } else {
                showAnswerPanel.classList.remove('hidden');
            }
        } else {
            // Recognize mode: always show front first
            spellShownSide = 'front';
            showAnswerPanel.classList.remove('hidden');
        }
    }

    function showAnswer() {
        if (spellShownSide === 'back') {
            flipCard.classList.remove('flipped');
        } else {
            flipCard.classList.add('flipped');
        }
        showAnswerPanel.classList.add('hidden');
        ratingPanel.classList.remove('hidden');
    }

    function handleSpellingSubmit() {
        if (spellPanel.classList.contains('hidden') || !currentCard) return;
        const userInput = spellInput.value.trim().toLowerCase();
        const correctWord = currentCard.front.trim().toLowerCase();

        spellPanel.classList.add('hidden');
        spellResultAlert.classList.remove('hidden');
        ratingPanel.classList.remove('hidden');

        // Show front side so they can see the word
        flipCard.classList.remove('flipped');

        if (userInput === correctWord) {
            spellResultAlert.textContent = "🎉 拼寫正確！";
            spellResultAlert.className = "spell-result-alert spell-success";
        } else {
            // 使用 textContent + 轉義防止 XSS
            spellResultAlert.innerHTML = `❌ 拼寫錯誤！<br>正確答案是：<strong class="font-outfit font-lg">${escapeHtml(currentCard.front)}</strong><br>您輸入的是：<strong>${escapeHtml(spellInput.value)}</strong>`;
            spellResultAlert.className = "spell-result-alert spell-error";
        }


    }

    function submitReview(rating) {
        if (reviewSubmitting || !currentCard || ratingPanel.classList.contains('hidden')) return;
        reviewSubmitting = true;
        const reviewedCardId = currentCard.id;
        const reviewRequestId = (globalThis.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : `${Date.now()}-${Math.random().toString(36).slice(2)}`;
        document.querySelectorAll('.btn-rating').forEach(btn => btn.disabled = true);

        fetch('/study/api/review', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken
            },
            body: JSON.stringify({
                card_id: reviewedCardId,
                rating: rating,
                request_id: reviewRequestId
            })
        })
        .then(async res => {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        })
        .then(data => {
            if (data.error) {
                alert('提交評估失敗！');
                return;
            }

            // Always remove the answered card. FSRS has already returned its
            // next due time; immediately re-queueing Again would bypass the
            // Learning/Relearning delay calculated by the scheduler.
            if (activeQueue[0] && activeQueue[0].id === reviewedCardId) {
                activeQueue.shift();
            }

            updateProgressUI();
            showNextCard();
        })
        .catch(err => {
            console.error(err);
            alert('送出作答結果時發生錯誤！');
            reviewSubmitting = false;
            document.querySelectorAll('.btn-rating').forEach(btn => btn.disabled = false);
        });
    }


    function openDictionary(word) {
        const cleanWord = encodeURIComponent(word.trim().replace(/\s+/g, '-'));
        const url = `https://dictionary.cambridge.org/dictionary/english-chinese-traditional/${cleanWord}`;
        window.open(url, '_blank');
    }

    function setupEventListeners() {
        // Show Answer Button
        btnShowAnswer.addEventListener('click', showAnswer);

        // Click Card to show answer
        flipCard.addEventListener('click', () => {
            if (!showAnswerPanel.classList.contains('hidden')) {
                showAnswer();
            }
        });

        // Spell submit
        spellSubmitBtn.addEventListener('click', handleSpellingSubmit);
        spellInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleSpellingSubmit();
            }
        });


        // Dictionary Buttons
        const openDictLink = () => openDictionary(currentCard.front);
        dictBtn.addEventListener('click', (e) => { e.stopPropagation(); openDictLink(); });
        dictBtnBack.addEventListener('click', (e) => { e.stopPropagation(); openDictLink(); });

        // Rating Buttons
        document.querySelectorAll('.btn-rating').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const rating = parseInt(btn.getAttribute('data-rating'));
                submitReview(rating);
            });
        });

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            // Ignore shortcut if user is typing in spell input
            if (document.activeElement === spellInput) return;

            // Space key to show answer
            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                if (!showAnswerPanel.classList.contains('hidden')) {
                    showAnswer();
                }
            }

            // Keys 1, 2, 3, 4 for rating
            if (!ratingPanel.classList.contains('hidden')) {
                if (e.key === '1') submitReview(1);
                if (e.key === '2') submitReview(2);
                if (e.key === '3') submitReview(3);
                if (e.key === '4') submitReview(4);
            }
        });
    }
</script>
{% endblock %}
